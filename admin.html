<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin Catálogo</title>
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
<header><h1>Panel administrativo</h1></header>
<div class="panel">

  <div id="login" class="box hidden">
    <form id="fLogin">
      <label>Usuario</label><input type="text" id="usuario" required autocapitalize="off">
      <label>Contraseña</label><input type="password" id="pass" required>
      <button>Ingresar</button>
      <p id="loginMsg" class="msg"></p>
    </form>
  </div>

  <div id="app" class="hidden">
    <div class="box">
      <h3 style="margin-top:0">Nueva pijama</h3>
      <form id="fNueva">
        <label>Imágenes * (puedes seleccionar varias; la primera será la portada)</label><input type="file" id="imagen" accept="image/*" multiple required>
        <label>Descripción</label><textarea id="descripcion" rows="2"></textarea>
        <label>Precio</label><input type="number" id="precio" step="0.01" min="0">
        <label>Talla</label><input type="text" id="talla">
        <label><input type="checkbox" id="disponible" checked> Disponible</label>
        <button id="btnGuardar">Guardar</button>
        <p id="nuevaMsg" class="msg"></p>
      </form>
    </div>

    <div class="box">
      <h3 style="margin-top:0">Pijamas cargadas</h3>
      <table><tbody id="lista"></tbody></table>
      <button class="sec" id="btnWebp">Convertir imágenes antiguas a WebP</button>
      <p id="webpMsg" class="msg"></p>
      <button class="sec" id="salir">Cerrar sesión</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=3"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

async function mostrar() {
  const { data: { session } } = await sb.auth.getSession();
  $("login").classList.toggle("hidden", !!session);
  $("app").classList.toggle("hidden", !session);
  if (session) listar();
}

$("fLogin").onsubmit = async e => {
  e.preventDefault();
  const u = $("usuario").value.trim().toLowerCase();
  const { error } = await sb.auth.signInWithPassword({ email: u.includes("@") ? u : u + "@pijamas.app", password: $("pass").value });
  $("loginMsg").textContent = error ? "Credenciales incorrectas" : "";
  mostrar();
};

// Reduce a máx. 1600px y convierte a WebP para ahorrar espacio en el storage
// (Safari no genera WebP desde canvas: en ese caso se usa JPEG comprimido)
async function comprimir(blob, max = 1600, calidad = 0.8) {
  const img = await createImageBitmap(blob);
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  const aBlob = tipo => new Promise(ok => c.toBlob(ok, tipo, calidad));
  const b = await aBlob("image/webp");
  return b?.type === "image/webp" ? b : aBlob("image/jpeg");
}
const ext = b => b.type === "image/webp" ? "webp" : "jpg";

const nombre = u => decodeURIComponent(u.split("/").pop());

// Migración única: reemplaza las imágenes que no son .webp
$("btnWebp").onclick = async () => {
  if (!confirm("¿Convertir a WebP todas las imágenes antiguas?")) return;
  $("btnWebp").disabled = true;
  try {
    const { data, error } = await sb.from(TABLA).select("*");
    if (error) throw error;
    let n = 0;
    for (const p of data) {
      const viejas = fotos(p);
      if (viejas.every(u => u.endsWith(".webp"))) continue;
      const nuevas = [];
      for (const u of viejas) {
        if (u.endsWith(".webp")) { nuevas.push(u); continue; }
        $("webpMsg").textContent = `Convirtiendo ${nombre(u)}...`;
        const img = await comprimir(await (await fetch(u)).blob());
        if (img.type !== "image/webp") throw new Error("Este navegador no genera WebP; usa Chrome, Edge o Firefox");
        const ruta = nombre(u).replace(/\.[^.]*$/, "") + ".webp";
        const up = await sb.storage.from(BUCKET).upload(ruta, img, { contentType: img.type, upsert: true });
        if (up.error) throw up.error;
        nuevas.push(sb.storage.from(BUCKET).getPublicUrl(ruta).data.publicUrl);
        n++;
      }
      const upd = await sb.from(TABLA).update({ imagen_url: nuevas[0], imagenes: nuevas }).eq("id", p.id);
      if (upd.error) throw upd.error;
      await sb.storage.from(BUCKET).remove(viejas.filter(u => !nuevas.includes(u)).map(nombre));
    }
    $("webpMsg").textContent = `Listo: ${n} imagen(es) convertida(s) ✔`;
    listar();
  } catch (err) {
    $("webpMsg").textContent = "Error: " + err.message;
  }
  $("btnWebp").disabled = false;
};

$("salir").onclick = async () => { await sb.auth.signOut(); mostrar(); };

$("fNueva").onsubmit = async e => {
  e.preventDefault();
  const files = [...$("imagen").files];
  $("btnGuardar").disabled = true;
  try {
    const imagenes = [];
    for (const [i, file] of files.entries()) {
      $("nuevaMsg").textContent = `Subiendo imagen ${i + 1} de ${files.length}...`;
      const img = await comprimir(file);
      const ruta = `${Date.now()}-${i}-${file.name.replace(/\.[^.]*$/, "").replace(/[^\w]/g, "_")}.${ext(img)}`;
      const up = await sb.storage.from(BUCKET).upload(ruta, img, { contentType: img.type });
      if (up.error) throw up.error;
      imagenes.push(sb.storage.from(BUCKET).getPublicUrl(ruta).data.publicUrl);
    }
    const precio = $("precio").value;
    const ins = await sb.from(TABLA).insert({
      imagen_url: imagenes[0],
      imagenes,
      descripcion: $("descripcion").value.trim() || null,
      precio: precio === "" ? null : Number(precio),
      talla: $("talla").value.trim() || null,
      disponible: $("disponible").checked,
    });
    if (ins.error) throw ins.error;
    e.target.reset(); $("disponible").checked = true;
    $("nuevaMsg").textContent = "Guardado ✔";
    listar();
  } catch (err) {
    $("nuevaMsg").textContent = "Error: " + err.message;
  }
  $("btnGuardar").disabled = false;
};

async function listar() {
  const { data, error } = await sb.from(TABLA).select("*").order("id", { ascending: false });
  if (error) { $("lista").innerHTML = `<tr><td>${esc(error.message)}</td></tr>`; return; }
  $("lista").innerHTML = data.map(p => `<tr>
    <td><img src="${esc(p.imagen_url)}"></td>
    <td>#${p.id} · ${fotos(p).length} foto(s)<br>${esc(p.descripcion)}<br>${p.talla ? "Talla " + esc(p.talla) : ""} ${p.precio != null ? "$" + Number(p.precio).toFixed(2) : ""}</td>
    <td><label><input type="checkbox" ${p.disponible ? "checked" : ""} onchange="toggle(${p.id}, this.checked)"> Disponible</label></td>
    <td><button class="del" onclick="borrar(${p.id})">Eliminar</button></td>
  </tr>`).join("") || "<tr><td>Sin registros</td></tr>";
  cache = data;
}

let cache = [];
const fotos = p => p.imagenes?.length ? p.imagenes : [p.imagen_url];

async function toggle(id, disponible) {
  const { error } = await sb.from(TABLA).update({ disponible }).eq("id", id);
  if (error) alert(error.message);
}

async function borrar(id) {
  if (!confirm("¿Eliminar la pijama #" + id + "?")) return;
  const p = cache.find(x => x.id === id);
  await sb.from(TABLA).delete().eq("id", id);
  if (p) await sb.storage.from(BUCKET).remove(fotos(p).map(nombre));
  listar();
}

mostrar();
</script>
</body>
</html>
