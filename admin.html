<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin Catálogo</title>
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
<header><h1>Panel administrativo</h1></header>
<div class="panel">

  <div id="login" class="box hidden">
    <form id="fLogin">
      <label>Usuario</label><input type="text" id="usuario" required autocapitalize="off">
      <label>Contraseña</label><input type="password" id="pass" required>
      <button>Ingresar</button>
      <p id="loginMsg" class="msg"></p>
    </form>
  </div>

  <div id="app" class="hidden">
    <div class="box" id="formBox">
      <h3 style="margin-top:0" id="tituloForm">Nueva pijama</h3>
      <form id="fNueva">
        <label>Imágenes * (toca una miniatura para hacerla portada)</label><input type="file" id="imagen" accept="image/*" multiple>
        <div id="previas" class="previas"></div>
        <label>Descripción</label><textarea id="descripcion" rows="4"></textarea>
        <div class="fila">
          <div><label>Precio</label><input type="number" id="precio" step="0.01" min="0"></div>
          <div><label>Talla</label><input type="text" id="talla"></div>
          <label class="check"><input type="checkbox" id="disponible" checked> Disponible</label>
        </div>
        <button id="btnGuardar">Guardar</button>
        <button type="button" class="sec hidden" id="btnCancelar">Cancelar</button>
        <p id="nuevaMsg" class="msg"></p>
      </form>
    </div>

    <div class="box">
      <h3 style="margin-top:0">Pijamas cargadas</h3>
      <div id="lista"></div>
      <button class="sec" id="btnWebp">Convertir imágenes antiguas a WebP</button>
      <p id="webpMsg" class="msg"></p>
      <button class="sec" id="salir">Cerrar sesión</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=3"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

async function mostrar() {
  const { data: { session } } = await sb.auth.getSession();
  $("login").classList.toggle("hidden", !!session);
  $("app").classList.toggle("hidden", !session);
  if (session) listar();
}

$("fLogin").onsubmit = async e => {
  e.preventDefault();
  const u = $("usuario").value.trim().toLowerCase();
  const { error } = await sb.auth.signInWithPassword({ email: u.includes("@") ? u : u + "@pijamas.app", password: $("pass").value });
  $("loginMsg").textContent = error ? "Credenciales incorrectas" : "";
  mostrar();
};

// Reduce a máx. 1600px y convierte a WebP para ahorrar espacio en el storage
// (Safari no genera WebP desde canvas: en ese caso se usa JPEG comprimido)
async function comprimir(blob, max = 1600, calidad = 0.8) {
  const img = await createImageBitmap(blob);
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  const aBlob = tipo => new Promise(ok => c.toBlob(ok, tipo, calidad));
  const b = await aBlob("image/webp");
  return b?.type === "image/webp" ? b : aBlob("image/jpeg");
}
const ext = b => b.type === "image/webp" ? "webp" : "jpg";

const nombre = u => decodeURIComponent(u.split("/").pop());

// Migración única: reemplaza las imágenes que no son .webp
$("btnWebp").onclick = async () => {
  if (!confirm("¿Convertir a WebP todas las imágenes antiguas?")) return;
  $("btnWebp").disabled = true;
  try {
    const { data, error } = await sb.from(TABLA).select("*");
    if (error) throw error;
    let n = 0;
    for (const p of data) {
      const viejas = fotos(p);
      if (viejas.every(u => u.endsWith(".webp"))) continue;
      const nuevas = [];
      for (const u of viejas) {
        if (u.endsWith(".webp")) { nuevas.push(u); continue; }
        $("webpMsg").textContent = `Convirtiendo ${nombre(u)}...`;
        const img = await comprimir(await (await fetch(u)).blob());
        if (img.type !== "image/webp") throw new Error("Este navegador no genera WebP; usa Chrome, Edge o Firefox");
        const ruta = nombre(u).replace(/\.[^.]*$/, "") + ".webp";
        const up = await sb.storage.from(BUCKET).upload(ruta, img, { contentType: img.type, upsert: true });
        if (up.error) throw up.error;
        nuevas.push(sb.storage.from(BUCKET).getPublicUrl(ruta).data.publicUrl);
        n++;
      }
      const upd = await sb.from(TABLA).update({ imagen_url: nuevas[0], imagenes: nuevas }).eq("id", p.id);
      if (upd.error) throw upd.error;
      await sb.storage.from(BUCKET).remove(viejas.filter(u => !nuevas.includes(u)).map(nombre));
    }
    $("webpMsg").textContent = `Listo: ${n} imagen(es) convertida(s) ✔`;
    listar();
  } catch (err) {
    $("webpMsg").textContent = "Error: " + err.message;
  }
  $("btnWebp").disabled = false;
};

$("salir").onclick = async () => { await sb.auth.signOut(); mostrar(); };

// Imágenes del formulario: { url } ya subidas o { file, url } nuevas (url = vista previa local)
let items = [];
let editando = null;

function pintarPrevias() {
  $("previas").innerHTML = items.map((it, i) => `<div class="previa${i ? "" : " portada"}" onclick="portada(${i})">
    <img src="${esc(it.url)}" alt="Imagen ${i + 1}">
    ${i ? "" : "<span>Portada</span>"}
    <button type="button" onclick="event.stopPropagation(); quitar(${i})" aria-label="Quitar">&times;</button>
  </div>`).join("");
}

function portada(i) { items.unshift(...items.splice(i, 1)); pintarPrevias(); }

function quitar(i) {
  const [it] = items.splice(i, 1);
  if (it.file) URL.revokeObjectURL(it.url);
  pintarPrevias();
}

$("imagen").onchange = e => {
  items.push(...[...e.target.files].map(file => ({ file, url: URL.createObjectURL(file) })));
  e.target.value = "";
  pintarPrevias();
};

function limpiarForm() {
  items.forEach(it => it.file && URL.revokeObjectURL(it.url));
  items = []; editando = null;
  $("fNueva").reset(); $("disponible").checked = true;
  $("tituloForm").textContent = "Nueva pijama";
  $("btnGuardar").textContent = "Guardar";
  $("btnCancelar").classList.add("hidden");
  pintarPrevias();
}
$("btnCancelar").onclick = () => { limpiarForm(); $("nuevaMsg").textContent = ""; };

function editar(id) {
  limpiarForm();
  const p = cache.find(x => x.id === id);
  editando = p;
  items = fotos(p).map(url => ({ url }));
  $("descripcion").value = p.descripcion ?? "";
  $("precio").value = p.precio ?? "";
  $("talla").value = p.talla ?? "";
  $("disponible").checked = p.disponible;
  $("tituloForm").textContent = `Editar pijama #${id}`;
  $("btnGuardar").textContent = "Guardar cambios";
  $("btnCancelar").classList.remove("hidden");
  $("nuevaMsg").textContent = "";
  pintarPrevias();
  $("formBox").scrollIntoView({ behavior: "smooth" });
}

$("fNueva").onsubmit = async e => {
  e.preventDefault();
  if (!items.length) { $("nuevaMsg").textContent = "Agrega al menos una imagen"; return; }
  const nuevas = items.filter(it => it.file).length;
  $("btnGuardar").disabled = true;
  try {
    const imagenes = [];
    let n = 0;
    for (const [i, it] of items.entries()) {
      if (!it.file) { imagenes.push(it.url); continue; }
      $("nuevaMsg").textContent = `Subiendo imagen ${++n} de ${nuevas}...`;
      const img = await comprimir(it.file);
      const ruta = `${Date.now()}-${i}-${it.file.name.replace(/\.[^.]*$/, "").replace(/[^\w]/g, "_")}.${ext(img)}`;
      const up = await sb.storage.from(BUCKET).upload(ruta, img, { contentType: img.type });
      if (up.error) throw up.error;
      imagenes.push(sb.storage.from(BUCKET).getPublicUrl(ruta).data.publicUrl);
    }
    const precio = $("precio").value;
    const datos = {
      imagen_url: imagenes[0],
      imagenes,
      descripcion: $("descripcion").value.trim() || null,
      precio: precio === "" ? null : Number(precio),
      talla: $("talla").value.trim() || null,
      disponible: $("disponible").checked,
    };
    const res = editando
      ? await sb.from(TABLA).update(datos).eq("id", editando.id)
      : await sb.from(TABLA).insert(datos);
    if (res.error) throw res.error;
    // Borra del storage las imágenes que se quitaron al editar
    const quitadas = editando ? fotos(editando).filter(u => !imagenes.includes(u)) : [];
    if (quitadas.length) await sb.storage.from(BUCKET).remove(quitadas.map(nombre));
    limpiarForm();
    $("nuevaMsg").textContent = "Guardado ✔";
    listar();
  } catch (err) {
    $("nuevaMsg").textContent = "Error: " + err.message;
  }
  $("btnGuardar").disabled = false;
};

async function listar() {
  const { data, error } = await sb.from(TABLA).select("*").order("id", { ascending: false });
  if (error) { $("lista").innerHTML = `<p>${esc(error.message)}</p>`; return; }
  $("lista").innerHTML = data.map(p => `<div class="item">
    <div class="item-info">
      <b>#${p.id}</b>${p.talla ? " · Talla " + esc(p.talla) : ""}${p.precio != null ? " · $" + Number(p.precio).toFixed(2) : ""}
      ${p.descripcion ? `<div class="item-desc">${esc(p.descripcion)}</div>` : ""}
    </div>
    <div class="item-acc">
      <label><input type="checkbox" ${p.disponible ? "checked" : ""} onchange="toggle(${p.id}, this.checked)"> Disponible</label>
      <button onclick="editar(${p.id})">Editar</button>
      <button class="del" onclick="borrar(${p.id})">Eliminar</button>
    </div>
    <div class="item-fotos">${fotos(p).map(u => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" loading="lazy" alt=""></a>`).join("")}</div>
  </div>`).join("") || "<p>Sin registros</p>";
  cache = data;
}

let cache = [];
const fotos = p => p.imagenes?.length ? p.imagenes : [p.imagen_url];

async function toggle(id, disponible) {
  const { error } = await sb.from(TABLA).update({ disponible }).eq("id", id);
  if (error) return alert(error.message);
  cache.find(x => x.id === id).disponible = disponible;
}

async function borrar(id) {
  if (!confirm("¿Eliminar la pijama #" + id + "?")) return;
  const p = cache.find(x => x.id === id);
  await sb.from(TABLA).delete().eq("id", id);
  if (p) await sb.storage.from(BUCKET).remove(fotos(p).map(nombre));
  if (editando?.id === id) limpiarForm();
  listar();
}

mostrar();
</script>
</body>
</html>
